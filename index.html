<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding 3D Cube</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* The stage: provides the 3D depth perception */
        .cube-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            perspective: 1000px; /* Essential for 3D effect */
        }

        /* The cube container: holds the faces and handles rotation */
        .cube {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d; /* Keeps children in 3D space */
            transform: translateZ(-100px) rotateX(-20deg) rotateY(45deg);
            transition: transform 1s ease-in-out;
            cursor: pointer;
        }

        /* Common styles for all 6 faces */
        .cube-face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            backface-visibility: visible; /* Allows seeing inside when expanded */
            transition: transform 1s ease-in-out, opacity 0.5s;
            opacity: 0.95;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* Initial 3D Positioning of Faces */
        /* TranslateZ moves them out from the center by half the width (100px) */
        .face-front  { transform: rotateY(0deg) translateZ(100px); background: #ffadad; }
        .face-back   { transform: rotateY(180deg) translateZ(100px); background: #ffd6a5; }
        .face-right  { transform: rotateY(90deg) translateZ(100px); background: #fdffb6; }
        .face-left   { transform: rotateY(-90deg) translateZ(100px); background: #caffbf; }
        .face-top    { transform: rotateX(90deg) translateZ(100px); background: #9bf6ff; }
        .face-bottom { transform: rotateX(-90deg) translateZ(100px); background: #a0c4ff; }

        /* --- EXPANDED STATE (The Magic) --- */
        
        /* Reset the main cube rotation to face the user directly */
        .cube.is-opened {
            transform: translateZ(-100px) rotateX(0deg) rotateY(0deg) !important;
        }

        /* Re-position faces into a flat 2D cross layout */
        /* We calculate offsets based on the face size (200px) + gaps */
        
        .cube.is-opened .face-front {
            transform: translate3d(0, 0, 0) rotateX(0) rotateY(0);
            z-index: 10; /* Keep front face on top */
        }

        .cube.is-opened .face-back {
            transform: translate3d(-600px, 0, 0) rotateY(0);
        }

        .cube.is-opened .face-right {
            transform: translate3d(200px, 0, 0) rotateY(0);
        }

        .cube.is-opened .face-left {
            transform: translate3d(-200px, 0, 0) rotateY(0);
        }

        .cube.is-opened .face-top {
            transform: translate3d(0, -200px, 0) rotateX(0);
        }

        .cube.is-opened .face-bottom {
            transform: translate3d(0, 200px, 0) rotateX(0);
        }

        /* Optional: Hover effect for interaction hint */
        .cube-face:hover {
            filter: brightness(0.9);
        }
    </style>
</head>
<body>

    <div class="cube-wrapper">
        <div class="cube" id="magicCube">
            <div class="cube-face face-front">Front</div>
            <div class="cube-face face-back">Back</div>
            <div class="cube-face face-right">Right</div>
            <div class="cube-face face-left">Left</div>
            <div class="cube-face face-top">Top</div>
            <div class="cube-face face-bottom">Bottom</div>
        </div>
    </div>

    <script>
        const cube = document.getElementById('magicCube');
        const faces = document.querySelectorAll('.cube-face');

        // Add click event to each face
        faces.forEach(face => {
            face.addEventListener('click', () => {
                // Toggle the 'is-opened' class to trigger CSS transitions
                cube.classList.toggle('is-opened');
            });
        });

        // Optional: Allow dragging to rotate the cube when closed
        let isDragging = false;
        let startX, startY, currentRotateX = -20, currentRotateY = 45;

        cube.addEventListener('mousedown', (e) => {
            if (cube.classList.contains('is-opened')) return; // Disable drag when open
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            cube.style.transition = 'none'; // Remove transition for instant drag response
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            currentRotateY += deltaX * 0.5;
            currentRotateX -= deltaY * 0.5;

            cube.style.transform = `translateZ(-100px) rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
            
            startX = e.clientX;
            startY = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                cube.style.transition = 'transform 1s ease-in-out'; // Restore transition
            }
        });
    </script>
</body>
</html>
